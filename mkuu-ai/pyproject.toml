[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "neckrone8x"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "httpx>=0.27",
    "arxiv>=2.1",
    "qdrant-client>=1.11",
    "sentence-transformers>=3.0",
    "rank-bm25>=0.2.2",
    "sqlalchemy>=2.0",
    "psycopg2-binary>=2.9",
    "tqdm>=4.66",
]
