<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>MKUU</title>
<link rel="manifest" href="/static/manifest.json">
<meta name="theme-color" content="#0a0a0a">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="mobile-web-app-capable" content="yes">
<link rel="apple-touch-icon" href="/static/icon-192.png">
<script src="https://cdn.jsdelivr.net/npm/marked@12/marked.min.js" defer></script>
<script src="https://cdn.jsdelivr.net/npm/dompurify@3/dist/purify.min.js" defer></script>
<style>
  :root {
    --bg: #0a0a0a;
    --panel: #111114;
    --panel-2: #16161a;
    --border: #23232a;
    --text: #e8e8e8;
    --muted: #8b8b96;
    --muted-2: #5a5a63;
    --blue: #3b82f6;
    --blue-2: #60a5fa;
    --green: #34d399;
    --red: #ef4444;
    --user: #2563eb;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    html { height: 100%; }
  body {
    overflow: hidden;
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Inter",
                 Roboto, "Helvetica Neue", Arial, sans-serif;
    font-size: 15px; line-height: 1.6;
    background: var(--bg); color: var(--text);
    height: 100dvh; display: flex; flex-direction: column;
    overscroll-behavior: none;
  }

  /* ---------- Header ---------- */
  header {
    padding: 12px 18px; border-bottom: 1px solid var(--border);
    display: flex; align-items: center; gap: 12px;
    position: sticky; top: 0; background: var(--bg); z-index: 10;
    padding-top: calc(12px + env(safe-area-inset-top));
  }
  header .logo {
    width: 28px; height: 28px; border-radius: 7px;
    background: linear-gradient(135deg, #3b82f6, #8b5cf6);
    display: flex; align-items: center; justify-content: center;
    font-weight: 800; font-size: 13px; color: white; flex-shrink: 0;
  }
  header h1 { font-size: 15px; margin: 0; font-weight: 600; letter-spacing: -0.01em; }
  header .badge {
    font-size: 10.5px; padding: 2px 8px; border-radius: 10px;
    background: #1e3a8a33; color: var(--blue-2);
    border: 1px solid #1e3a8a66; text-transform: uppercase; letter-spacing: 0.03em;
    font-weight: 600;
  }
  header .spacer { flex: 1; }
  header .icon-btn {
    background: transparent; border: 0; color: var(--muted);
    padding: 6px; border-radius: 6px; cursor: pointer;
    display: flex; align-items: center; justify-content: center;
  }
  header .icon-btn:hover { background: var(--panel); color: var(--text); }
  header .status { font-size: 11.5px; color: var(--muted); display: flex; align-items: center; gap: 6px; }
  header .dot {
    width: 6px; height: 6px; border-radius: 50%; background: var(--green);
    box-shadow: 0 0 8px var(--green);
  }

  /* ---------- Chat ---------- */
  #chat {
    flex: 1; overflow-y: auto; padding: 24px 18px 100px;
    scroll-behavior: smooth;
  }
  #chat-inner { max-width: 820px; margin: 0 auto; display: flex; flex-direction: column; gap: 20px; }

  .msg { display: flex; gap: 12px; animation: fadeIn 0.2s ease; }
  @keyframes fadeIn { from { opacity: 0; transform: translateY(4px); } to { opacity: 1; transform: none; } }

  .msg .avatar {
    width: 30px; height: 30px; border-radius: 8px; flex-shrink: 0;
    display: flex; align-items: center; justify-content: center;
    font-size: 12px; font-weight: 700; color: white;
    margin-top: 2px;
  }
  .msg.bot .avatar { background: linear-gradient(135deg, #10b981, #34d399); }
  .msg.user .avatar { background: var(--user); }

  .msg .content { flex: 1; min-width: 0; }
  .msg .meta {
    display: flex; align-items: center; gap: 10px; margin-bottom: 4px;
    font-size: 11.5px; color: var(--muted);
  }
  .msg .name { font-weight: 600; color: var(--text); font-size: 12.5px; }
  .msg.bot .name { color: var(--green); }

  /* Message body — markdown */
  .body { word-wrap: break-word; overflow-wrap: anywhere; }
  .body p { margin: 0 0 10px; }
  .body p:last-child { margin-bottom: 0; }
  .body strong { color: #fff; font-weight: 600; }
  .body em { font-style: italic; color: #d4d4d8; }
  .body a { color: var(--blue-2); text-decoration: none; border-bottom: 1px solid #3b82f666; }
  .body a:hover { border-bottom-color: var(--blue-2); }
  .body ul, .body ol { margin: 6px 0 12px; padding-left: 22px; }
  .body li { margin: 3px 0; }
  .body li::marker { color: var(--muted); }
  .body h1, .body h2, .body h3, .body h4 {
    margin: 14px 0 8px; font-weight: 600; line-height: 1.3; color: #fff;
  }
  .body h1 { font-size: 18px; }
  .body h2 { font-size: 16px; }
  .body h3 { font-size: 15px; }
  .body h4 { font-size: 14px; }
  .body code {
    background: #1c1c22; padding: 2px 6px; border-radius: 4px;
    font-family: ui-monospace, "SF Mono", Consolas, monospace; font-size: 13px;
    color: #fca5a5;
  }
  .body pre {
    background: #131318; border: 1px solid var(--border); border-radius: 8px;
    padding: 12px 14px; overflow-x: auto; margin: 10px 0;
  }
  .body pre code {
    background: none; padding: 0; color: #e4e4e7; font-size: 12.5px; line-height: 1.55;
  }
  .body blockquote {
    border-left: 3px solid var(--border); margin: 8px 0; padding: 4px 14px;
    color: var(--muted);
  }
  .body hr { border: 0; border-top: 1px solid var(--border); margin: 14px 0; }

  /* Streaming cursor */
  .stream::after {
    content: "▋"; color: var(--green); margin-left: 2px;
    animation: blink 1s step-end infinite;
  }
  @keyframes blink { 50% { opacity: 0; } }

  /* Papers */
  .papers {
    margin-top: 12px; padding: 10px 14px;
    background: #0f1512; border-left: 3px solid var(--green);
    border-radius: 6px; font-size: 12px; color: var(--muted);
  }
  .papers .papers-title {
    font-size: 10.5px; text-transform: uppercase; letter-spacing: 0.05em;
    color: var(--green); font-weight: 700; margin-bottom: 6px;
  }
  .papers .paper { margin: 4px 0; line-height: 1.5; }
  .papers .paper em { color: var(--muted-2); font-style: normal; font-size: 11px; }
  .papers .num {
    display: inline-block; background: #10b98133; color: var(--green);
    padding: 0 5px; border-radius: 3px; font-weight: 600; font-size: 10.5px;
    margin-right: 4px;
  }

  /* Message actions */
  .actions {
    display: flex; gap: 4px; margin-top: 6px; opacity: 0;
    transition: opacity 0.15s;
  }
  .msg:hover .actions { opacity: 1; }
  @media (hover: none) { .actions { opacity: 1; } }
  .action-btn {
    background: transparent; border: 0; color: var(--muted-2);
    padding: 4px 6px; border-radius: 4px; cursor: pointer;
    font-size: 11px; display: inline-flex; align-items: center; gap: 5px;
    font-family: inherit;
  }
  .action-btn:hover { background: var(--panel); color: var(--text); }

  /* Stop button */
  #stop-bar { display: none; justify-content: center; padding: 0 0 16px; }
  #stop-bar.visible { display: flex; }
  #stop-btn {
    background: var(--panel); border: 1px solid var(--border);
    color: var(--text); padding: 8px 16px; border-radius: 20px;
    font-size: 13px; cursor: pointer; display: inline-flex;
    align-items: center; gap: 8px; font-family: inherit;
  }
  #stop-btn:hover { background: var(--panel-2); }

  /* Scroll-to-bottom */
  #scroll-bottom {
    position: fixed; bottom: 92px; right: 24px;
    width: 40px; height: 40px; border-radius: 50%;
    background: var(--panel-2); border: 1px solid var(--border);
    color: var(--text); cursor: pointer; display: none;
    align-items: center; justify-content: center;
    z-index: 5; box-shadow: 0 4px 16px rgba(0,0,0,0.4);
  }
  #scroll-bottom.visible { display: flex; }

  /* ---------- Footer ---------- */
  footer {
    padding: 12px 18px;
    padding-bottom: calc(12px + env(safe-area-inset-bottom));
    border-top: 1px solid var(--border);
    background: var(--bg);
  }
  form {
    max-width: 820px; margin: 0 auto; display: flex; gap: 8px;
    align-items: flex-end;
  }
  #input {
    flex: 1; padding: 12px 16px;
    background: var(--panel); color: var(--text);
    border: 1px solid var(--border); border-radius: 12px;
    font-size: 16px; font-family: inherit; resize: none;
    outline: none; transition: border-color 0.15s;
    max-height: 160px; min-height: 48px; line-height: 1.4;
  }
  #input:focus { border-color: var(--blue); }
  #input::placeholder { color: var(--muted-2); }

  .send-btn {
    width: 48px; height: 48px; flex-shrink: 0;
    border: 0; border-radius: 12px; cursor: pointer;
    background: var(--blue); color: white;
    display: flex; align-items: center; justify-content: center;
    transition: background 0.15s, transform 0.05s;
  }
  .send-btn:hover:not(:disabled) { background: #2563eb; }
  .send-btn:active:not(:disabled) { transform: scale(0.95); }
  .send-btn:disabled { opacity: 0.4; cursor: not-allowed; }

  .mic-btn {
    width: 48px; height: 48px; flex-shrink: 0;
    background: var(--panel); border: 1px solid var(--border);
    color: var(--muted); border-radius: 12px; cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    transition: all 0.15s;
  }
  .mic-btn:hover:not(:disabled) { background: var(--panel-2); color: var(--text); }
  .mic-btn:disabled { opacity: 0.35; cursor: not-allowed; }
  .mic-btn.recording {
    background: #7f1d1d; color: #fecaca; border-color: var(--red);
    animation: pulse-mic 1.2s ease-in-out infinite;
  }
  @keyframes pulse-mic {
    0%, 100% { box-shadow: 0 0 0 0 rgba(239, 68, 68, 0.4); }
    50%      { box-shadow: 0 0 0 10px rgba(239, 68, 68, 0); }
  }

  svg { display: block; }

   /* ---------- Mobile tweaks ---------- */
  @media (max-width: 640px) {
    body { font-size: 15.5px; }
    header { padding: 10px 14px; padding-top: calc(10px + env(safe-area-inset-top)); }
    header h1 { font-size: 14.5px; }
    header .badge { font-size: 10px; padding: 2px 6px; }
    #chat { padding: 18px 14px 110px; }
    .msg { gap: 10px; }
    .msg .avatar { width: 28px; height: 28px; font-size: 11px; }
    .body code { font-size: 12.5px; }
    .body pre { font-size: 12px; padding: 10px 12px; }
    .papers { font-size: 11.5px; padding: 8px 12px; }
    footer { padding: 10px 14px; padding-bottom: calc(10px + env(safe-area-inset-bottom)); }
    form { gap: 6px; }
    #input { padding: 11px 14px; font-size: 16px; }
    .send-btn, .mic-btn { width: 44px; height: 44px; }
    #scroll-bottom { bottom: 84px; right: 14px; width: 36px; height: 36px; }
    .actions { opacity: 1; }
    #stop-bar { padding-bottom: 12px; }
  }

  /* Very narrow phones */
  @media (max-width: 380px) {
    header .badge { display: none; }
    #input { font-size: 15px; }
  }

</style>
</head>
<body>
<header>
  <div class="logo">M</div>
  <h1>MKUU</h1>
  <span class="badge">research agent</span>
  <div class="spacer"></div>
  <span class="status"><span class="dot" id="dot"></span><span id="status">checking…</span></span>
  <button class="icon-btn" id="clear-btn" title="New chat" aria-label="New chat">
    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/>
    </svg>
  </button>
</header>

<div id="chat">
  <div id="chat-inner">
    <div class="msg bot">
      <div class="avatar">M</div>
      <div class="content">
        <div class="meta"><span class="name">MKUU</span><span>·</span><span id="welcome-time">now</span></div>
        <div class="body">
          <p>Karibu. Ask me anything — research, weather, or just chat.</p>
          <p style="color:var(--muted-2);font-size:12.5px;margin-top:6px">Tip: click the mic to speak. Try Sheng or Kiswahili too.</p>
        </div>
      </div>
    </div>
  </div>
</div>

<div id="stop-bar"><button id="stop-btn">
  <svg width="12" height="12" viewBox="0 0 24 24" fill="currentColor"><rect x="6" y="6" width="12" height="12" rx="2"/></svg>
  Stop
</button></div>

<button id="scroll-bottom" title="Scroll to bottom">
  <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
    <polyline points="6 9 12 15 18 9"/>
  </svg>
</button>

<footer>
  <form id="form">
    <textarea id="input" placeholder="Ask MKUU anything…" rows="1" autocomplete="off" autofocus></textarea>
    <button class="mic-btn" id="mic" type="button" title="Voice input" aria-label="Voice input">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M12 2a3 3 0 0 0-3 3v7a3 3 0 0 0 6 0V5a3 3 0 0 0-3-3z"/>
        <path d="M19 10v2a7 7 0 0 1-14 0v-2"/>
        <line x1="12" y1="19" x2="12" y2="23"/>
        <line x1="8" y1="23" x2="16" y2="23"/>
      </svg>
    </button>
    <button class="send-btn" id="send" type="submit" aria-label="Send">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <line x1="12" y1="19" x2="12" y2="5"/>
        <polyline points="5 12 12 5 19 12"/>
      </svg>
    </button>
  </form>
</footer>

<script>
(() => {
  const chatEl = document.getElementById('chat');
  const chatInner = document.getElementById('chat-inner');
  const form = document.getElementById('form');
  const input = document.getElementById('input');
  const sendBtn = document.getElementById('send');
  const micBtn = document.getElementById('mic');
  const statusEl = document.getElementById('status');
  const clearBtn = document.getElementById('clear-btn');
  const stopBar = document.getElementById('stop-bar');
  const stopBtn = document.getElementById('stop-btn');
  const scrollBottom = document.getElementById('scroll-bottom');

  let sessionId = localStorage.getItem('n8x_session') || null;
  let currentController = null;

  /* -------- Status -------- */
  fetch('/health').then(r => r.json()).then(d => {
    statusEl.textContent = d.offline ? 'offline' : 'online';
    document.getElementById('dot').style.background =
      d.offline ? '#f59e0b' : '#34d399';
  }).catch(() => {
    statusEl.textContent = 'offline';
    document.getElementById('dot').style.background = '#ef4444';
  });

  /* -------- Markdown -------- */
  function escapeHtml(s) {
    return String(s).replace(/[&<>"']/g, c => ({
      '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'
    }[c]));
  }
  function renderMarkdown(text) {
    if (typeof marked === 'undefined' || typeof DOMPurify === 'undefined') {
      return escapeHtml(text).replace(/\n/g, '<br>');
    }
    try {
      marked.setOptions({ breaks: true, gfm: true });
      return DOMPurify.sanitize(marked.parse(text));
    } catch (e) {
      return escapeHtml(text).replace(/\n/g, '<br>');
    }
  }

  /* -------- Time formatting -------- */
  function nowTime() {
    const d = new Date();
    return d.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
  }

  /* -------- Auto-scroll -------- */
  let autoScroll = true;
  chatEl.addEventListener('scroll', () => {
    const nearBottom = chatEl.scrollHeight - chatEl.scrollTop - chatEl.clientHeight < 80;
    autoScroll = nearBottom;
    scrollBottom.classList.toggle('visible', !nearBottom);
  });
  scrollBottom.addEventListener('click', () => {
    chatEl.scrollTop = chatEl.scrollHeight;
    autoScroll = true;
    scrollBottom.classList.remove('visible');
  });
  function scrollDown(force = false) {
    if (autoScroll || force) chatEl.scrollTop = chatEl.scrollHeight;
  }

  /* -------- Message rendering -------- */
  function addMessage(who, text = '', opts = {}) {
    const div = document.createElement('div');
    div.className = 'msg ' + who;

    const initials = who === 'user' ? 'Y' : 'M';
    const name = who === 'user' ? 'You' : 'MKUU';

    div.innerHTML = `
      <div class="avatar">${initials}</div>
      <div class="content">
        <div class="meta">
          <span class="name">${name}</span>
          <span>·</span>
          <span class="time">${nowTime()}</span>
        </div>
        <div class="body"></div>
        <div class="actions"></div>
      </div>
    `;
    chatInner.appendChild(div);

    const body = div.querySelector('.body');
    const actions = div.querySelector('.actions');

    if (who === 'bot' && !opts.noStream) {
      body.innerHTML = '<span class="stream"></span>';
    } else {
      body.innerHTML = renderMarkdown(text);
    }

    if (opts.showActions) {
      const copyBtn = document.createElement('button');
      copyBtn.className = 'action-btn';
      copyBtn.innerHTML = `
        <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <rect x="9" y="9" width="13" height="13" rx="2" ry="2"/>
          <path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/>
        </svg>
        Copy
      `;
      copyBtn.addEventListener('click', () => {
        const plain = body.innerText;
        navigator.clipboard.writeText(plain).then(() => {
          copyBtn.innerHTML = '✓ Copied';
          setTimeout(() => {
            copyBtn.innerHTML = `
              <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <rect x="9" y="9" width="13" height="13" rx="2" ry="2"/>
                <path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/>
              </svg>
              Copy`;
          }, 1500);
        });
      });
      actions.appendChild(copyBtn);
    }

    scrollDown();
    return { div, body, actions };
  }

  function addPapers(container, papers) {
    if (!papers || !papers.length) return;
    const el = document.createElement('div');
    el.className = 'papers';
    el.innerHTML = `<div class="papers-title">Sources</div>` +
      papers.map((p, i) =>
        `<div class="paper"><span class="num">${i+1}</span>${escapeHtml(p.title)}
         <em>(${escapeHtml(p.source)}, ${p.score.toFixed(3)})</em></div>`
      ).join('');
    container.appendChild(el);
  }

  /* -------- Streaming send -------- */
  async function sendMessage(text) {
    if (!text) return;
    text = text.trim();
    if (!text) return;

    input.value = '';
    input.style.height = 'auto';
    autoScroll = true;

    addMessage('user', text, { noStream: true, showActions: true });
    const { div: botDiv, body: botBody, actions: botActions } =
      addMessage('bot', '', { noStream: false });

    input.disabled = true;
    sendBtn.disabled = true;
    stopBar.classList.add('visible');

        currentController = new AbortController();
    let fullText = '';
    let renderScheduled = false;
    let finished = false;

    function scheduleRender() {
      if (renderScheduled || finished) return;
      renderScheduled = true;
      requestAnimationFrame(() => {
        renderScheduled = false;
        if (finished) return;
        botBody.innerHTML = renderMarkdown(fullText) +
          '<span class="stream"></span>';
        scrollDown();
      });
    }

    try {
      const r = await fetch('/chat/stream', {
        method: 'POST',
        headers: { 'content-type': 'application/json' },
        body: JSON.stringify({ session_id: sessionId, message: text }),
        signal: currentController.signal,
      });

      const reader = r.body.getReader();
      const decoder = new TextDecoder();
      let buffer = '';

      while (true) {
        const { value, done } = await reader.read();
        if (done) break;
        buffer += decoder.decode(value, { stream: true });
        const parts = buffer.split('\n\n');
        buffer = parts.pop();

        for (const part of parts) {
          const line = part.trim();
          if (!line.startsWith('data: ')) continue;
          const payload = JSON.parse(line.slice(6));

          if (payload.meta) {
            sessionId = payload.meta.session_id;
            localStorage.setItem('n8x_session', sessionId);
          } else if (payload.token) {
            fullText += payload.token;
            scheduleRender();
            } else if (payload.done) {
            finished = true;
            botBody.innerHTML = renderMarkdown(fullText);
            addPapers(botBody, payload.papers);
            const copyBtn = document.createElement('button');
            copyBtn.className = 'action-btn';
            copyBtn.innerHTML = `
              <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <rect x="9" y="9" width="13" height="13" rx="2" ry="2"/>
                <path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/>
              </svg>
              Copy`;
            copyBtn.addEventListener('click', () => {
              navigator.clipboard.writeText(fullText);
              copyBtn.innerHTML = '✓ Copied';
              setTimeout(() => {
                copyBtn.innerHTML = `
                  <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <rect x="9" y="9" width="13" height="13" rx="2" ry="2"/>
                    <path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/>
                  </svg>
                  Copy`;
              }, 1500);
            });
            botActions.appendChild(copyBtn);
          } else if (payload.error) {
            botBody.innerHTML =
              `<span style="color:#ef4444">Error: ${escapeHtml(payload.error)}</span>`;
          }
        }
      }
    } catch (err) {
      if (err.name === 'AbortError') {
        botBody.innerHTML = renderMarkdown(fullText) +
          '<p style="color:var(--muted);font-size:12.5px;margin-top:8px">— stopped</p>';
      } else {
        botBody.innerHTML =
          `<span style="color:#ef4444">Connection error: ${escapeHtml(err.message)}</span>`;
      }
    } finally {
      currentController = null;
      input.disabled = false;
      sendBtn.disabled = false;
      stopBar.classList.remove('visible');
      input.focus();
    }
  }

  /* -------- Submit -------- */
  form.addEventListener('submit', e => {
    e.preventDefault();
    sendMessage(input.value);
  });

  /* Auto-grow textarea, Enter to send, Shift+Enter for newline */
  input.addEventListener('input', () => {
    input.style.height = 'auto';
    input.style.height = Math.min(input.scrollHeight, 160) + 'px';
  });
  input.addEventListener('keydown', e => {
    if (e.key === 'Enter' && !e.shiftKey) {
      e.preventDefault();
      form.requestSubmit();
    }
  });

  /* -------- Stop generating -------- */
  stopBtn.addEventListener('click', () => {
    if (currentController) currentController.abort();
  });

  /* -------- Clear chat -------- */
  clearBtn.addEventListener('click', () => {
    if (chatInner.children.length <= 1) return;
    if (!confirm('Start a new conversation?')) return;
    chatInner.innerHTML = `
      <div class="msg bot">
        <div class="avatar">M</div>
        <div class="content">
          <div class="meta"><span class="name">MKUU</span><span>·</span><span>now</span></div>
          <div class="body"><p>New chat. Karibu tena.</p></div>
        </div>
      </div>`;
    sessionId = null;
    localStorage.removeItem('n8x_session');
  });

  /* -------- Voice input -------- */
  const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  if (!SR) {
    micBtn.disabled = true;
    micBtn.title = 'Voice not supported';
  } else {
    let lang = 'en-US';
    const navLang = (navigator.language || '').toLowerCase();
    if (navLang.startsWith('sw')) lang = 'sw-KE';
    else if (navLang.startsWith('en-ke')) lang = 'en-KE';

    const rec = new SR();
    rec.continuous = false;
    rec.interimResults = true;
    rec.lang = lang;

    let recording = false;
    let finalText = '';

    rec.onstart = () => {
      recording = true;
      micBtn.classList.add('recording');
      input.placeholder = 'Listening…';
      finalText = '';
    };
    rec.onresult = ev => {
      let interim = '';
      for (let i = ev.resultIndex; i < ev.results.length; i++) {
        const t = ev.results[i][0].transcript;
        if (ev.results[i].isFinal) finalText += t;
        else interim += t;
      }
      input.value = (finalText + interim).trim();
      input.style.height = 'auto';
      input.style.height = Math.min(input.scrollHeight, 160) + 'px';
    };
    rec.onerror = ev => {
      if (ev.error === 'not-allowed') alert('Mic permission denied.');
      stopRec();
    };
    rec.onend = () => {
      stopRec();
      const text = input.value.trim();
      if (text && finalText.trim()) sendMessage(text);
    };
    function startRec() { try { rec.start(); } catch(e) {} }
    function stopRec() {
      recording = false;
      micBtn.classList.remove('recording');
      input.placeholder = 'Ask MKUU anything…';
      try { rec.stop(); } catch(e) {}
    }
    micBtn.addEventListener('click', () => recording ? stopRec() : startRec());
  }

  /* -------- PWA service worker -------- */
  if ('serviceWorker' in navigator) {
    window.addEventListener('load', () => {
      navigator.serviceWorker.register('/static/sw.js').catch(() => {});
    });
  }
})();
</script>
</body>
</html>
